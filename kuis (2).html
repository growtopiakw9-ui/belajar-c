@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2236;--card:#252e47;--ink:#fff3b8;--muted:#b9bfd4;--line:#3a456a;--code:#10172a}}
:root[data-theme="dark"]{--bg:#1b2236;--card:#252e47;--ink:#fff3b8;--muted:#b9bfd4;--line:#3a456a;--code:#10172a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header{text-align:center;padding:20px 0 8px}
header h1{margin:0;font-size:clamp(26px,6vw,40px);color:var(--blue)}
:root[data-theme="dark"] header h1{color:var(--yellow)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header h1{color:var(--yellow)}}
header p{margin:4px 0 0;color:var(--muted)}
.mascot{font-size:56px;animation:bob 2s ease-in-out infinite;display:inline-block}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.mascot{animation:none}}
.tabs{display:flex;gap:8px;justify-content:center;margin:14px 0}
.tab{border:3px solid var(--blue);background:var(--card);color:var(--blue);font:inherit;font-weight:800;padding:10px 18px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--blue);color:#fff}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 6px 0 var(--line)}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;font-size:14px}
.q{font-size:19px;font-weight:800;margin:10px 0}
pre.snip,pre.out{background:var(--code);color:var(--codeink);padding:12px;border-radius:14px;overflow:auto;font:14px/1.5 ui-monospace,Consolas,monospace;margin:8px 0;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;font:inherit;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0;cursor:pointer;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.ok{border-color:var(--ok);background:rgba(46,158,91,.18)}
.opt.bad{border-color:var(--bad);background:rgba(229,72,77,.18)}
.opt:disabled{cursor:default}
.exp{margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(255,217,59,.28);font-weight:600}
button.go{background:var(--yellow);color:#2b2a33;border:3px solid var(--yellow2);font:inherit;font-weight:900;padding:10px 20px;border-radius:999px;cursor:pointer;box-shadow:0 4px 0 var(--yellow2)}
button.go:active{transform:translateY(3px);box-shadow:none}
button.alt{background:var(--card);color:var(--blue);border:3px solid var(--blue);font:inherit;font-weight:800;padding:8px 14px;border-radius:999px;cursor:pointer}
:root[data-theme="dark"] button.alt{color:var(--yellow);border-color:var(--yellow)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.sp{flex:1}
textarea{width:100%;background:var(--code);color:var(--codeink);border:3px solid var(--line);border-radius:14px;padding:12px;font:14px/1.5 ui-monospace,Consolas,monospace;resize:vertical;tab-size:4}
label{font-weight:800;display:block;margin-top:10px}
.score{text-align:center}
.score .big{font-size:48px;font-weight:900;color:var(--blue)}
:root[data-theme="dark"] .score .big{color:var(--yellow)}
.hide{display:none}
footer{text-align:center;color:var(--muted);font-size:13px;padding:18px 0}
.warn{font-size:13px;color:var(--muted);margin-top:8px}
.modes{display:grid;gap:12px;margin-top:12px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:20px;padding:14px 16px;cursor:pointer;box-shadow:0 4px 0 var(--line)}
.mode:hover{border-color:var(--blue)}
.mode .ic{font-size:30px}
.mode b{font-size:20px;display:block}
.mode small{color:var(--muted);font-weight:700}
h2.t{text-align:center;margin:0 0 4px}
.sub{text-align:center;color:var(--muted);margin:0 0 6px}
.note{text-align:center;font-weight:700;margin-top:10px}
a.mode{text-decoration:none}a.alt{text-decoration:none;display:inline-block}.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}.flash{position:fixed;inset:0;background:rgba(229,72,77,.45);pointer-events:none;z-index:50;animation:fl .6s ease-out forwards}
@keyframes fl{to{opacity:0}}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.conf{position:fixed;top:-12px;width:10px;height:14px;pointer-events:none;z-index:60;border-radius:2px}

/* tema tosca 3D */
body{background:linear-gradient(160deg,#37c3cf 0%,#1f89ab 45%,#173d78 100%) fixed;min-height:100vh}
header h1{color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.2)}
header p{color:#e6fbff}
footer{color:#d3f1f7}
button.go,a.go{background:#ff8a3d;color:#fff;border:3px solid #e8691a;box-shadow:0 5px 0 #c9560f;text-shadow:0 1px 0 rgba(0,0,0,.2)}
button.go:active,a.go:active{transform:translateY(4px);box-shadow:none}
.card{box-shadow:0 8px 0 rgba(0,0,0,.18),0 18px 40px rgba(8,30,70,.25);border-color:rgba(255,255,255,.55)}
a.alt{background:rgba(255,255,255,.92);color:#1f4f9c;border:3px solid #fff;border-radius:999px;padding:8px 16px;font-weight:800;text-decoration:none;display:inline-block}
</style>
</head>

const MODES={
  easy:{name:"Gampang",ic:"🍌",desc:"Dasar-dasar C"},
  mid:{name:"Sedang",ic:"🍌🍌",desc:"Fungsi, array, pointer dasar, tebak output"},
  hard:{name:"Sulit",ic:"🍌🍌🍌",desc:"Pointer, memori, undefined behavior, trik bit"}
};
const PER=20;
const $=id=>document.getElementById(id);

/* riwayat soal yang sudah keluar (disimpan di browser jika bisa) */
let seen={easy:[],mid:[],hard:[]};
try{const s=JSON.parse(localStorage.getItem("pisangC_seen")||"null");if(s&&s.easy&&s.mid&&s.hard)seen=s}catch(e){}
function saveSeen(){try{localStorage.setItem("pisangC_seen",JSON.stringify(seen))}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let mode=null,set=[],i=0,score=0,done=false;

function renderMenu(note){
  const box=$("modes");box.innerHTML="";
  Object.keys(MODES).forEach(k=>{
    const left=BANK[k].length-seen[k].length;
    const b=document.createElement("button");b.className="mode";
    b.innerHTML='<span class="ic">'+MODES[k].ic+'</span><span><b>'+MODES[k].name+'</b><small>'+MODES[k].desc+' · soal baru tersisa: '+left+'</small></span>';
    b.onclick=()=>start(k);box.append(b);
  });
  const n=$("resetnote");
  if(note){n.textContent=note;n.classList.remove("hide")}else n.classList.add("hide");
  $("menu").classList.remove("hide");$("play").classList.add("hide");
}
function start(k){
  mode=k;
  let ids=BANK[k].map((_,n)=>n).filter(n=>!seen[k].includes(n));
  let note="";
  if(ids.length<PER){
    /* soal baru hampir habis: pakai sisa soal baru, lalu isi dengan soal lama */
    const old=BANK[k].map((_,n)=>n).filter(n=>seen[k].includes(n));
    ids=ids.concat(shuffle(old).slice(0,PER-ids.length));
    seen[k]=[];
  } else ids=shuffle(ids).slice(0,PER);
  seen[k]=seen[k].concat(ids.filter(n=>!seen[k].includes(n)));saveSeen();
  set=ids.map(n=>{
    const [q,opts,a,e,c]=BANK[k][n];
    const order=shuffle(opts.map((_,x)=>x));
    return {q,c,e,o:order.map(x=>opts[x]),a:order.indexOf(a)};
  });
  i=0;score=0;
  $("menu").classList.add("hide");$("play").classList.remove("hide");
  show();
}
function show(){
  const q=set[i];done=false;
  $("no").textContent=MODES[mode].name+" · Soal "+(i+1)+" / "+set.length;
  $("sc").textContent="Skor: "+score;
  $("pb").style.width=(i/set.length*100)+"%";
  $("next").classList.add("hide");
  const box=$("qbox");box.innerHTML="";
  const p=document.createElement("div");p.className="q";p.textContent=q.q;box.append(p);
  if(q.c){const pre=document.createElement("pre");pre.className="snip";pre.textContent=q.c;box.append(pre)}
  q.o.forEach((t,k)=>{
    const b=document.createElement("button");b.className="opt";b.textContent="ABCD"[k]+". "+t;
    b.onclick=()=>pick(k);box.append(b);
  });
}
/* efek suara & visual */
let AC=null;
function tone(f,t0,d,type,vol){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.05);
}
function sfx(ok){
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();
    const t=AC.currentTime;
    if(ok){[523,659,784,1047].forEach((f,n)=>tone(f,t+n*.09,.25,"triangle",.25));tone(1319,t+.4,.5,"triangle",.25);}
    else{tone(311,t,.2,"sawtooth",.16);tone(233,t+.22,.55,"sawtooth",.16);}
  }catch(e){}
}
const REDUCE=matchMedia("(prefers-reduced-motion:reduce)").matches;
function confetti(){
  if(REDUCE)return;
  const colors=["#ffd93b","#2f6fcf","#e5484d","#2e9e5b","#ff8fab","#8e6cf0"];
  for(let n=0;n<70;n++){
    const d=document.createElement("div");d.className="conf";
    d.style.left=Math.random()*100+"vw";d.style.background=colors[n%colors.length];
    document.body.append(d);
    const x=(Math.random()-.5)*240,dur=1400+Math.random()*1200;
    d.animate([{transform:"translate(0,0) rotate(0deg)",opacity:1},{transform:"translate("+x+"px,"+(innerHeight+40)+"px) rotate("+(Math.random()*720)+"deg)",opacity:.9}],{duration:dur,easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish=()=>d.remove();
  }
}
function redFlash(){
  const f=document.createElement("div");f.className="flash";document.body.append(f);
  setTimeout(()=>f.remove(),700);
  if(!REDUCE){const b=$("qbox");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")}
}
function fx(ok){sfx(ok);if(ok)confetti();else redFlash()}
function pick(k){
  if(done)return;done=true;
  const q=set[i],btns=[...document.querySelectorAll(".opt")];
  btns.forEach((b,n)=>{b.disabled=true;if(n===q.a)b.classList.add("ok");});
  q.p=k;fx(k===q.a);
  if(k===q.a)score++;else btns[k].classList.add("bad");
  const e=document.createElement("div");e.className="exp";
  e.textContent=(k===q.a?"Benar! 🎉 ":"Belum tepat 🍌 ")+q.e;
  $("qbox").append(e);
  $("sc").textContent="Skor: "+score;
  $("next").textContent=i===set.length-1?"Lihat hasil":"Lanjut ➜";
  $("next").classList.remove("hide");
}
$("next").onclick=()=>{
  i++;
  if(i>=set.length){
    $("pb").style.width="100%";
    const pct=Math.round(score/set.length*100);
    const msg=pct>=80?"Hebat banget! 🍌🍌🍌":pct>=50?"Lumayan, ayo coba lagi!":"Semangat, belajar lagi yuk!";
    $("qbox").innerHTML='<div class="score"><div style="font-size:48px">🏆</div><div class="big">'+score+' / '+set.length+'</div><p style="font-weight:800;font-size:18px">✅ Benar: '+score+' &nbsp;·&nbsp; ❌ Salah: '+(set.length-score)+'</p><p>'+msg+'</p><p class="sub">Selanjutnya pilih mode lagi ya. Soalnya akan baru!</p><button class="go" id="again">Pilih mode</button></div>';
    renderReview();
    if(pct>=80){confetti();sfx(true)}
    $("next").classList.add("hide");
    $("again").onclick=()=>renderMenu();
  } else show();
};
function renderReview(){
  const box=$("qbox"),wrong=set.filter(q=>q.p!==q.a);
  const h=document.createElement("h3");h.style.margin="18px 0 6px";
  h.textContent=wrong.length?"📝 Pembahasan jawaban yang salah":"🎉 Semua jawabanmu benar!";
  box.append(h);
  wrong.forEach(q=>{
    const d=document.createElement("div");d.className="card";d.style.cssText="margin:10px 0;padding:12px 14px;box-shadow:none";
    const p=document.createElement("div");p.className="q";p.style.fontSize="16px";p.textContent=q.q;d.append(p);
    if(q.c){const pre=document.createElement("pre");pre.className="snip";pre.textContent=q.c;d.append(pre)}
    const a=document.createElement("div");a.style.cssText="color:var(--bad);font-weight:800";a.textContent="❌ Jawabanmu: "+q.o[q.p];d.append(a);
    const b=document.createElement("div");b.style.cssText="color:var(--ok);font-weight:800;margin-top:2px";b.textContent="✅ Jawaban benar: "+q.o[q.a];d.append(b);
    const e=document.createElement("div");e.className="exp";e.textContent="Kenapa kurang tepat: "+q.e;d.append(e);
    box.append(d);
  });
}
$("quit").onclick=()=>renderMenu();
renderMenu();

$("theme").onclick=()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";$("theme").textContent=dark?"🌙":"☀️";
};
