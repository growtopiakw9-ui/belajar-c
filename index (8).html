@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2236;--card:#252e47;--ink:#fff3b8;--muted:#b9bfd4;--line:#3a456a;--code:#10172a}}
:root[data-theme="dark"]{--bg:#1b2236;--card:#252e47;--ink:#fff3b8;--muted:#b9bfd4;--line:#3a456a;--code:#10172a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header{text-align:center;padding:20px 0 8px}
header h1{margin:0;font-size:clamp(26px,6vw,40px);color:var(--blue)}
:root[data-theme="dark"] header h1{color:var(--yellow)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header h1{color:var(--yellow)}}
header p{margin:4px 0 0;color:var(--muted)}
.mascot{font-size:56px;animation:bob 2s ease-in-out infinite;display:inline-block}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.mascot{animation:none}}
.tabs{display:flex;gap:8px;justify-content:center;margin:14px 0}
.tab{border:3px solid var(--blue);background:var(--card);color:var(--blue);font:inherit;font-weight:800;padding:10px 18px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--blue);color:#fff}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 6px 0 var(--line)}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;font-size:14px}
.q{font-size:19px;font-weight:800;margin:10px 0}
pre.snip,pre.out{background:var(--code);color:var(--codeink);padding:12px;border-radius:14px;overflow:auto;font:14px/1.5 ui-monospace,Consolas,monospace;margin:8px 0;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;font:inherit;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0;cursor:pointer;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.ok{border-color:var(--ok);background:rgba(46,158,91,.18)}
.opt.bad{border-color:var(--bad);background:rgba(229,72,77,.18)}
.opt:disabled{cursor:default}
.exp{margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(255,217,59,.28);font-weight:600}
button.go{background:var(--yellow);color:#2b2a33;border:3px solid var(--yellow2);font:inherit;font-weight:900;padding:10px 20px;border-radius:999px;cursor:pointer;box-shadow:0 4px 0 var(--yellow2)}
button.go:active{transform:translateY(3px);box-shadow:none}
button.alt{background:var(--card);color:var(--blue);border:3px solid var(--blue);font:inherit;font-weight:800;padding:8px 14px;border-radius:999px;cursor:pointer}
:root[data-theme="dark"] button.alt{color:var(--yellow);border-color:var(--yellow)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.sp{flex:1}
textarea{width:100%;background:var(--code);color:var(--codeink);border:3px solid var(--line);border-radius:14px;padding:12px;font:14px/1.5 ui-monospace,Consolas,monospace;resize:vertical;tab-size:4}
label{font-weight:800;display:block;margin-top:10px}
.score{text-align:center}
.score .big{font-size:48px;font-weight:900;color:var(--blue)}
:root[data-theme="dark"] .score .big{color:var(--yellow)}
.hide{display:none}
footer{text-align:center;color:var(--muted);font-size:13px;padding:18px 0}
.warn{font-size:13px;color:var(--muted);margin-top:8px}
.modes{display:grid;gap:12px;margin-top:12px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:20px;padding:14px 16px;cursor:pointer;box-shadow:0 4px 0 var(--line)}
.mode:hover{border-color:var(--blue)}
.mode .ic{font-size:30px}
.mode b{font-size:20px;display:block}
.mode small{color:var(--muted);font-weight:700}
h2.t{text-align:center;margin:0 0 4px}
.sub{text-align:center;color:var(--muted);margin:0 0 6px}
.note{text-align:center;font-weight:700;margin-top:10px}
a.mode{text-decoration:none}a.alt{text-decoration:none;display:inline-block}.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
/* tema tosca 3D */
body{background:linear-gradient(160deg,#37c3cf 0%,#1f89ab 45%,#173d78 100%) fixed;min-height:100vh}
header h1{color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.2)}
header p{color:#e6fbff}
footer{color:#d3f1f7}
button.go,a.go{background:#ff8a3d;color:#fff;border:3px solid #e8691a;box-shadow:0 5px 0 #c9560f;text-shadow:0 1px 0 rgba(0,0,0,.2)}
button.go:active,a.go:active{transform:translateY(4px);box-shadow:none}
.card{box-shadow:0 8px 0 rgba(0,0,0,.18),0 18px 40px rgba(8,30,70,.25);border-color:rgba(255,255,255,.55)}
a.alt{background:rgba(255,255,255,.92);color:#1f4f9c;border:3px solid #fff;border-radius:999px;padding:8px 16px;font-weight:800;text-decoration:none;display:inline-block}

.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 0}
.nav .logo{width:44px;height:44px;border-radius:50%;object-fit:cover;border:3px solid #ffd93b}
.nav .links{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.nav a.l{color:#fff;font-weight:800;text-decoration:none;padding:8px 14px;border-radius:999px}
.nav a.l:hover{background:rgba(255,255,255,.18)}
.nav .tb{background:rgba(255,255,255,.92);border:0;border-radius:999px;width:40px;height:40px;cursor:pointer;font-size:18px}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:center;padding:26px 0 18px}
.hero h1{font-size:clamp(44px,9vw,92px);line-height:.98;margin:0;color:#fff;letter-spacing:-1px;text-shadow:0 6px 0 rgba(0,0,0,.2)}
.hero p.lead{color:#e9fbff;font-weight:700;font-size:clamp(16px,2.4vw,20px);max-width:30ch;margin:18px 0 22px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.cta a{text-decoration:none;font-weight:900;letter-spacing:.5px;padding:14px 28px;border-radius:999px;font-size:16px;display:inline-block}
.cta a.ghost{color:#fff;border:3px solid rgba(255,255,255,.85);background:rgba(255,255,255,.08)}
.cta a.ghost:hover{background:rgba(255,255,255,.2)}
.art{width:112%;max-width:600px;justify-self:center;animation:floaty 5s ease-in-out infinite;filter:drop-shadow(0 22px 24px rgba(6,24,60,.35))}
@keyframes floaty{50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){.art{animation:none}}
@media (max-width:720px){.hero{grid-template-columns:1fr;text-align:center;padding-top:10px}.hero p.lead{margin-left:auto;margin-right:auto}.cta{justify-content:center}.nav .links a.l{padding:6px 10px}}

.scene{position:relative;width:100%;max-width:600px;justify-self:center;padding-top:44px}
.scene .art{position:relative;z-index:1;display:block;margin:0 auto}
.cl{position:absolute;left:0;z-index:0;transform:translateX(var(--x,0%));animation:drift var(--d,50s) linear infinite;animation-delay:var(--dl,0s);filter:drop-shadow(0 8px 10px rgba(6,40,90,.18));pointer-events:none}
.cl.f{z-index:2}
@keyframes drift{from{transform:translateX(-160%)}to{transform:translateX(480%)}}
@media (prefers-reduced-motion:reduce){.cl{animation:none}}
</style>
</head>

<div class="card" style="margin-bottom:14px;padding:12px 14px">
  <label for="splink" style="margin:0 0 6px">🎧 Putar lagu dari Spotify</label>
  <div class="row" style="margin:0">
    <input id="splink" type="url" placeholder="Ganti dengan link Spotify lain (opsional)" style="flex:1;min-width:180px;font:inherit;padding:8px 12px;border-radius:999px;border:3px solid var(--line);background:var(--card);color:var(--ink)">
    <button class="go" id="spgo" style="padding:8px 16px">Muat</button>
  </div>
  <div id="spbox" style="margin-top:10px"></div>
  <p class="warn" id="spmsg" style="margin:6px 0 0">Buka lagunya di Spotify, pilih Bagikan, lalu salin link dan tempel di sini. Lagu diputar langsung dari Spotify (butuh internet).</p>
</div>



<footer>Dibuat untuk belajar C dengan santai</footer>
</div>
<script>
const $=id=>document.getElementById(id);
/* Spotify */
function loadSpotify(url){
  const m=/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|playlist|album|episode|show)\/([A-Za-z0-9]+)/.exec(url||"");
  if(!m){$("spmsg").textContent="Link tidak dikenali. Contoh: https://open.spotify.com/track/xxxx";return false}
  const f=document.createElement("iframe");
  f.src="https://open.spotify.com/embed/"+m[1]+"/"+m[2];
  f.width="100%";f.height=m[1]==="track"?"152":"420";f.style.border="0";f.style.borderRadius="14px";
  f.allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";f.loading="lazy";
  $("spbox").innerHTML="";$("spbox").append(f);
  $("spmsg").textContent="Tekan tombol play di pemutar Spotify di atas. Login Spotify supaya lagu diputar penuh.";
  return true;
}
$("spgo").onclick=()=>{
  const u=$("splink").value.trim();
  if(loadSpotify(u)){try{localStorage.setItem("pisangC_sp",u)}catch(e){}}
};
const DEFAULT_SP="https://open.spotify.com/playlist/2ryQh20ld6q5Egs7rAY6xZ";
let startSp=DEFAULT_SP;
try{startSp=localStorage.getItem("pisangC_sp")||DEFAULT_SP}catch(e){}
$("splink").value=startSp;loadSpotify(startSp);

$("theme").onclick=()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";$("theme").textContent=dark?"🌙":"☀️";
};

</script>
